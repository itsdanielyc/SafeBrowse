name: Windows verification

on:
  pull_request:
  push:
    branches-ignore:
      - star-history
  workflow_call:

permissions:
  contents: read

concurrency:
  group: windows-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc
      - name: Install Node for behavior fixtures
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Install the current Microsoft WebView2 Evergreen Runtime
        run: |
          $bootstrapperPath = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrapperPath
          $signature = Get-AuthenticodeSignature -LiteralPath $bootstrapperPath
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(?:^|, )O=Microsoft Corporation(?:,|$)') {
            throw 'The runtime bootstrapper does not have a valid Microsoft signature.'
          }
          $runtimeInstall = Start-Process -FilePath $bootstrapperPath -ArgumentList '/silent', '/install' -WindowStyle Hidden -Wait -PassThru
          if ($runtimeInstall.ExitCode -ne 0 -and $runtimeInstall.ExitCode -ne 3010) {
            throw "WebView2 setup failed with exit code $($runtimeInstall.ExitCode)."
          }
      - name: Check formatting
        run: cargo fmt --check
      - name: Check all Rust targets
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test Rust and hidden native WebView fixtures
        run: |
          cargo test --locked --lib browser::runtime::tests::installed_runtime_is_discoverable_without_creating_a_session -- --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked
      - name: Test JavaScript behavior
        run: node --test tests/keyboard_dom_tests.cjs tests/website_print_guard_tests.cjs tests/star_history_tests.mjs
      - name: Test release guards and packaging with a disposable fixture
        run: ./scripts/Test-ReleaseTooling.ps1
      - name: Verify the Windows dependency license notices
        run: ./scripts/New-ThirdPartyNotices.ps1 -Check
      - name: Install pinned RustSec audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit the resolved Windows dependency graph
        run: ./scripts/Test-WindowsDependencies.ps1
      - name: Retain the dependency report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-dependency-audit
          path: target/windows-dependency-audit.json
          if-no-files-found: warn
          retention-days: 14
