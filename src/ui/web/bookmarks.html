<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bookmarks — SafeBrowse</title>
<style>
__COMMON_CSS__
.page-header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 26px; }
.page-header p { margin-bottom: 0; }
.toolbar { display: flex; align-items: center; gap: 18px; margin-bottom: 18px; }
.search-wrap { position: relative; max-width: 380px; flex: 1; }
.search-wrap svg { position: absolute; left: 12px; top: 10px; color: #777; pointer-events: none; }
.search-wrap input { padding-left: 36px; }
#count { margin-left: auto; color: #666; font-size: 12px; white-space: nowrap; }
.bookmarks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.bookmark { display: flex; align-items: center; background: #fff; border: 1px solid #dedede; border-radius: 5px; min-width: 0; padding: 5px; }
.bookmark:hover { border-color: #b7c5bc; }
.open-bookmark { border: 0; background: transparent; display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; text-align: left; padding: 12px 8px; border-radius: 3px; }
.site-icon { width: 34px; height: 34px; flex-shrink: 0; display: grid; place-items: center; font-size: 16px; font-weight: 500; color: #45614e; background: #edf1ed; border: 1px solid #e0e6df; border-radius: 5px; }
.bookmark-text { min-width: 0; }
.bookmark-title { display: block; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bookmark-domain { display: block; color: #666; font-size: 12px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.remove-bookmark { flex-shrink: 0; margin-right: 3px; color: #777; }
.remove-bookmark:hover { color: var(--danger); background: #fff0ef; }
.empty { text-align: center; padding: 52px 20px; border: 1px solid #dedede; border-radius: 5px; background: #fff; }
.empty h2 { margin-bottom: 7px; }
.empty p { margin: 0; color: #666; }
.status { margin-top: 12px; }
dialog { width: min(460px, calc(100% - 36px)); padding: 0; border: 1px solid #ccc; border-radius: 7px; color: #242424; background: white; box-shadow: 0 12px 40px #00000020; }
dialog::backdrop { background: #0005; }
.dialog-body { padding: 24px; }
.dialog-body h2 { font-size: 20px; margin-bottom: 18px; }
.dialog-body label { display: block; font-size: 12px; font-weight: 600; margin: 16px 0 6px; }
.dialog-body .field { height: 36px; }
.dialog-body .hint { font-size: 12px; color: #666; margin: 7px 0 0; }
.dialog-actions { padding: 16px 24px; display: flex; gap: 8px; justify-content: flex-end; border-top: 1px solid #e5e5e5; background: #fafafa; }
.dialog-actions .button { min-width: 84px; }
@media(max-width: 640px) { .bookmarks { grid-template-columns: 1fr; } .page-header { align-items: flex-start; } .page-header > .button { padding: 6px 10px; } }
</style></head>
<body><main class="page">
<header class="page-header"><div><p class="eyebrow">SafeBrowse</p><h1>Bookmarks</h1><p class="muted">Keep your important websites close.</p></div><button class="button primary" id="add-bookmark">Add bookmark</button></header>
<div class="toolbar"><div class="search-wrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input type="search" class="field" id="search" placeholder="Search bookmarks" aria-label="Search bookmarks" autocomplete="off"></div><span id="count" aria-live="polite"></span></div>
<div class="bookmarks" id="bookmarks" role="list" aria-label="Saved bookmarks"></div>
<div class="empty" id="empty" hidden><h2 id="empty-title">No bookmarks yet</h2><p id="empty-description">Add a website to get started.</p></div>
<div class="status" id="status" role="status" aria-live="polite"></div>
</main>
<dialog id="add-dialog" aria-labelledby="dialog-title">
<form id="bookmark-form">
    <div class="dialog-body"><h2 id="dialog-title">Add bookmark</h2>
        <label for="bookmark-title">Name</label><input id="bookmark-title" class="field" required maxlength="200" autocomplete="off" placeholder="A name you will recognize">
        <label for="bookmark-url">Website address</label><input id="bookmark-url" class="field" required maxlength="8192" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://example.com">
        <p class="hint">Check the address before saving. A bookmark does not verify a website.</p>
        <div class="status" id="form-status" role="alert"></div>
    </div>
    <div class="dialog-actions"><button type="button" class="button" id="cancel-bookmark">Cancel</button><button type="submit" class="button primary" id="save-bookmark">Save</button></div>
</form>
</dialog>
<script>
__COMMON_JAVASCRIPT__
let bookmarks = __PRESENTATION_JSON__;
const search = document.getElementById('search');
const dialog = document.getElementById('add-dialog');

function websiteDomain(address) {
    try { return new URL(address).host; } catch { return String(address); }
}

/** Matches native URL restrictions before the browser can normalize ambiguous input. */
function normalizeBookmarkAddress(input) {
    if (/[\u0000-\u001f\u007f\\]/.test(input)) throw new Error('Unsupported address');
    const authority = input.split(/[/?#]/)[0];
    const hasHostPort = /^(?:localhost|[^:]+\.[^:]+|\[[\da-f:]+\]):\d+$/i.test(authority);
    const hasScheme = /^[a-z][a-z\d+.-]*:/i.test(input) && !hasHostPort;
    const explicit = input.startsWith('//') ? 'https:' + input : hasScheme ? input : 'https://' + input;
    const address = new URL(explicit);
    if (!['http:', 'https:'].includes(address.protocol) || !address.hostname || address.username || address.password) throw new Error('Unsupported address');
    return address.href;
}

/** O(n) time and space; filtering and rendering visit each saved bookmark once. */
function renderBookmarks() {
    const query = search.value.trim().toLocaleLowerCase();
    const visible = bookmarks.filter(bookmark => (bookmark.title + ' ' + bookmark.url).toLocaleLowerCase().includes(query));
    const fragment = document.createDocumentFragment();
    visible.forEach(bookmark => {
        const row = document.createElement('div');
        row.className = 'bookmark';
        row.setAttribute('role', 'listitem');
        const open = document.createElement('button');
        open.className = 'open-bookmark';
        open.title = String(bookmark.url);
        const icon = document.createElement('span');
        icon.className = 'site-icon';
        icon.setAttribute('aria-hidden', 'true');
        icon.textContent = Array.from(String(bookmark.title || websiteDomain(bookmark.url)))[0]?.toLocaleUpperCase() || 'W';
        const text = document.createElement('span');
        text.className = 'bookmark-text';
        const name = document.createElement('span');
        name.className = 'bookmark-title';
        name.textContent = String(bookmark.title || websiteDomain(bookmark.url));
        const domain = document.createElement('span');
        domain.className = 'bookmark-domain';
        domain.textContent = websiteDomain(bookmark.url);
        text.append(name, domain);
        open.append(icon, text);
        open.addEventListener('click', () => postIpc({ type: 'NAVIGATE', url: bookmark.url }));
        const remove = document.createElement('button');
        remove.className = 'icon-button remove-bookmark';
        remove.setAttribute('aria-label', 'Remove ' + name.textContent);
        remove.title = 'Remove bookmark';
        const removeIcon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        removeIcon.setAttribute('width', '16');
        removeIcon.setAttribute('height', '16');
        removeIcon.setAttribute('viewBox', '0 0 24 24');
        removeIcon.setAttribute('fill', 'none');
        removeIcon.setAttribute('stroke', 'currentColor');
        removeIcon.setAttribute('stroke-width', '1.6');
        removeIcon.setAttribute('aria-hidden', 'true');
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', 'M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7');
        removeIcon.append(path);
        remove.append(removeIcon);
        remove.addEventListener('click', () => postIpc({ type: 'REMOVE_BOOKMARK', id: bookmark.id }));
        row.append(open, remove);
        fragment.append(row);
    });
    document.getElementById('bookmarks').replaceChildren(fragment);
    document.getElementById('count').textContent = visible.length + (visible.length === 1 ? ' bookmark' : ' bookmarks');
    document.getElementById('empty').hidden = visible.length !== 0;
    document.getElementById('empty-title').textContent = query ? 'No matching bookmarks' : 'No bookmarks yet';
    document.getElementById('empty-description').textContent = query ? 'Try a different name or website address.' : 'Add a website to get started.';
}

window.showStatus = function(message, isError = false) {
    const status = document.getElementById('status');
    status.textContent = String(message);
    status.dataset.error = String(Boolean(isError));
    if (dialog.open) {
        document.getElementById('form-status').textContent = isError ? String(message) : '';
        document.getElementById('form-status').dataset.error = String(Boolean(isError));
        document.getElementById('save-bookmark').disabled = false;
    }
};
window.showBookmarkStatus = window.showStatus;
window.updateBookmarks = function(updated) {
    bookmarks = Array.isArray(updated) ? updated : [];
    if (dialog.open) dialog.close();
    document.getElementById('save-bookmark').disabled = false;
    renderBookmarks();
};

document.getElementById('add-bookmark').addEventListener('click', () => {
    document.getElementById('bookmark-form').reset();
    document.getElementById('form-status').textContent = '';
    document.getElementById('save-bookmark').disabled = false;
    dialog.showModal();
    document.getElementById('bookmark-title').focus();
});
document.getElementById('cancel-bookmark').addEventListener('click', () => dialog.close());
document.getElementById('bookmark-form').addEventListener('submit', event => {
    event.preventDefault();
    const title = document.getElementById('bookmark-title').value.trim();
    const enteredAddress = document.getElementById('bookmark-url').value.trim();
    if (!title || !enteredAddress) { window.showStatus('Enter a name and website address.', true); return; }
    let address;
    try {
        address = normalizeBookmarkAddress(enteredAddress);
    } catch {
        window.showStatus('Enter a valid HTTP or HTTPS website address without sign-in details.', true);
        document.getElementById('bookmark-url').focus();
        return;
    }
    document.getElementById('save-bookmark').disabled = true;
    document.getElementById('form-status').textContent = 'Saving…';
    postIpc({ type: 'ADD_BOOKMARK_FROM_DATA', title, url: address });
});
search.addEventListener('input', renderBookmarks);
renderBookmarks();
notifyReady();
</script></body></html>
