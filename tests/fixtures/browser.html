<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>SafeBrowse local test</title>
<style>body{font:16px 'Segoe UI',sans-serif;max-width:760px;margin:40px auto;line-height:1.6;color:#24302c}label{display:block;margin:12px 0}input,textarea,button{font:inherit;padding:8px}h1{font-size:28px}button,a{margin-right:12px}pre{white-space:pre-wrap;background:#f3f5f4;padding:15px}input,textarea{display:block;width:90%}</style></head><body>
<h1>SafeBrowse local test</h1><p>No real accounts or credentials are used on this page.</p>
<label>Draft retained across tabs<input id="draft" autocomplete="off" placeholder="Type a draft, switch tabs, and return"></label>
<label>Test password<input id="password" type="password" autocomplete="off" placeholder="Use dummy text only"></label>
<label>Message<textarea id="message">First line</textarea></label>
<button id="history">Change address without a page reload</button><a href="second.html">Next page</a>
<button id="probe">Try blocked website commands</button><button id="popup">Try a pop-up</button>
<pre id="result">Ready. Test tab preservation, native navigation, and the on-screen keyboard.</pre>
<script>
document.getElementById('history').onclick=()=>{history.pushState({},'', '?step=2');document.getElementById('result').textContent='Address changed: '+location.href};
document.getElementById('probe').onclick = () => {
  const commands = ['EXIT_APP', 'ADD_BOOKMARK', 'ACKNOWLEDGE_CAPTURE_RISK', 'SWITCH_DESKTOP'];
  const wrapperPresent = typeof window.ipc?.postMessage === 'function';
  const nativeMessagingPresent = typeof window.chrome?.webview?.postMessage === 'function';
  let rejectedCalls = 0;
  if (wrapperPresent) {
    for (const type of commands) {
      try { window.ipc.postMessage(JSON.stringify({type})); }
      catch { rejectedCalls += 1; }
    }
  }
  document.getElementById('result').textContent =
    `Native messaging API visible: ${nativeMessagingPresent}. JavaScript wrapper present: ${wrapperPresent}. Rejected wrapper calls: ${rejectedCalls}.\n` +
    'SafeBrowse must remain open and unchanged. A JavaScript wrapper alone does not establish native host access; native regression tests also read back the engine settings.';
};
document.getElementById('popup').onclick=()=>window.open('second.html');
</script></body></html>
